<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Innova - Inventario</title>

  <!-- Librería Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { font-family: sans-serif; padding: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background-color: #f2f2f2; }
  </style>
</head>
<body>

  <h1>Inventario de Productos - Innova</h1>

  <table>
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Precio</th>
        <th>Stock</th>
      </tr>
    </thead>
    <tbody id="tabla-body">
      <tr><td colspan="3">Cargando datos...</td></tr>
    </tbody>
  </table>

  <script>
    // Configuración de Supabase
  const SUPABASE_URL = 'https://smmsucyqiurtsgrnfezt.supabase.co';
const SUPABASE_KEY = 'sb_publishable_lxggBHMUQ1B0JoT3OuQDSQ_MXHgnMIK';
const _supabase = supabase.createClient(supabase_URL, supabase_KEY);

async function cargarProductos() {
  const { data, error } = await _supabase.from('productos').select('*');

      if (error) {
        console.error('Error al cargar datos:', error);
        document.getElementById('tabla-body').innerHTML = '<tr><td colspan="3">Error al cargar datos</td></tr>';
        return;
      }

      const tbody = document.getElementById('tabla-body');
      tbody.innerHTML = '';

      data.forEach(p => {
        const fila = `
          <tr>
            <td>${p.nombre || p.descripcion || '-'}</td>
            <td>$${p.precio || '0'}</td>
            <td>${p.stock || '0'}</td>
          </tr>
        `;
        
        tbody.innerHTML += fila;
      });
    }

    cargarProductos();
  </script>

</body>
</html>
